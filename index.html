<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live NSE Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Market Watch</h1>
                <p id="updateTime" class="text-sm text-slate-500 font-medium mt-1">Initializing...</p>
            </div>
            
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="filterTable()" 
                    placeholder="Search symbol..." 
                    class="pl-4 pr-10 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none w-full md:w-64">
            </div>
        </header>

        <div id="status" class="bg-blue-50 text-blue-700 p-4 rounded-lg mb-4 text-center font-medium">
            Fetching live market data...
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table id="nseTable" class="min-w-full divide-y divide-slate-200 hidden">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Symbol</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Price</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Change %</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Volume</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-200 bg-white">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. REPLACE THIS with your actual Google Script Web App URL
        const googleScriptUrl = "YOUR_DEPLOYED_URL_HERE"; 

        async function fetchNSEData() {
            try {
                const response = await fetch(googleScriptUrl);
                const nseData = await response.json();
                const tableBody = document.getElementById('tableBody');
                
                tableBody.innerHTML = '';
                
                nseData.data.forEach(stock => {
                    const changeVal = parseFloat(stock.pChange);
                    const colorClass = changeVal >= 0 ? "text-green-600" : "text-red-600";
                    const sign = changeVal > 0 ? "+" : "";
                    
                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap font-bold text-slate-700">${stock.symbol}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right font-mono text-slate-600">${stock.lastPrice}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right font-mono font-bold ${colorClass}">${sign}${stock.pChange}%</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm text-slate-400">${stock.totalTradedVolume}</td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });

                // Update UI state
                document.getElementById('status').style.display = 'none';
                document.getElementById('nseTable').style.display = 'table';
                document.getElementById('updateTime').innerText = "Last Updated: " + new Date().toLocaleTimeString();
                
                // Keep filter active after refresh
                filterTable();

            } catch (error) {
                document.getElementById('status').innerHTML = "Connection Error. Retrying...";
                document.getElementById('status').classList.replace('text-blue-700', 'text-red-700');
                console.error("Fetch error:", error);
            }
        }

        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("tableBody");
            const rows = table.getElementsByTagName("tr");

            for (let i = 0; i < rows.length; i++) {
                const symbolCell = rows[i].getElementsByTagName("td")[0];
                if (symbolCell) {
                    const txtValue = symbolCell.textContent || symbolCell.innerText;
                    rows[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        // Initial fetch
        fetchNSEData();

        // 2. AUTO-REFRESH: Set to 30,000ms (30 seconds)
        setInterval(fetchNSEData, 30000);
    </script>
</body>
</html>
